name: Terraform Dev

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]


permissions:
  contents: read
  pull-requests: write   # needed so the workflow can post PR comments

env:
  TF_WORKING_DIR: .

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, terraform]   # targets your EC2 runner by its label
    steps:
      - uses: actions/checkout@v4        # pulls your repo code onto the runner

      - name: Terraform fmt check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive   # fails if code isn't formatted properly

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false   # downloads providers, connects to backend

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate   # catches syntax/type errors

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan | tee plan_output.txt
        # -out=tfplan saves a binary plan file we reuse later in apply
        # tee also writes the human-readable output to a text file for the PR comment

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8').slice(-60000);
            const body = `#### Terraform Plan (dev)\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload plan artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1
        # saves the exact plan file so "apply" below applies THIS plan, not a new one

  apply:
    name: Apply
    needs: plan                     # won't start until "plan" job finishes successfully
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, terraform]
    environment: dev-apply          # <- this is what triggers the manual approval pause
    steps:
      - uses: actions/checkout@v4

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
        # applying the saved plan file (not re-planning) means what got approved
        # is exactly what gets applied